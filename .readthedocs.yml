# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    post_install:
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --no-deps .

python:
  install:
    - method: uv
      command: pip
      requirements: pylock.docs.toml

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

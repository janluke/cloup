name: CI

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

jobs:
  checks:
    name: ${{ matrix.desc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { script: code:lint, desc: "Lint files" }
          - { script: code:format --check, desc: "Check formatting" }
          - { script: docs:build, desc: "Build documentation" }
          - { script: package:build, desc: "Build and validate distributions" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: ${{ matrix.desc }}
        run: hatch run ${{ matrix.script }}

  tests:
    name: Python ${{ matrix.python }}, click ${{ matrix.click }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        click: [ "latest-supported" ]
        include:
          - { python: "3.14", click: "8.5" }

    steps:
      - name: Set test env name
        run: |
          TEST_ENV="test.py${{ matrix.python }}"
          if [[ "${{ matrix.click }}" != "latest-supported" ]]; then
            TEST_ENV="${TEST_ENV}-click_${{ matrix.click }}"
          fi
          echo "TEST_ENV=${TEST_ENV}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: Check types with Pyrefly
        run: hatch run $TEST_ENV:typing-pyrefly

      - name: Check types with mypy
        run: hatch run $TEST_ENV:typing-mypy

      - name: Run tests with coverage
        run: hatch run $TEST_ENV:test-cov

      - name: Store coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.click }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch

      - name: Download coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and report coverage
        run: hatch run coverage:report xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true

  publish:
    name: Publish package to PyPI
    needs: [ checks, tests ]
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'janluke/cloup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install pypa/build
        run: python -m pip install build --user

      - name: Build a binary wheel and a source tarball
        run: python -m build . --sdist --wheel --outdir dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
